<!DOCTYPE html>
<html style="background-color: deepskyblue;">
    <head>
        <title>
            Registration PAGE
        </title>
    </head>
    <body align="center">
        <h1>REGISTRATION PAGE</h1>
        <form action="SUCCESS.html" method="post">
            Name : <input type="text" name="g1" placeholder="Enter your name" autofocus>&nbsp;&nbsp;
            Email : <input type="email" name="g2" placeholder="abc@klh.edu.in" required><br><br>
            Mobile : <input type="number" name="g3" placeholder="Mobile.no" pattern="[0-9] {10}" required><br><br>
            Course :<select name="g4" required>
                <option value="1">SELECT</option>
                <option>B.Tech</option>
                <option>M.Tech</option>
                <option>P.hD</option>
            </select><br><br>
            Gender : <input type="radio" name="g5" required>Male
            <input type="radio" name="g5">Female
            <input type="radio" name="g5">Others<br><br>
            Adress : <textarea name="g6" required row="3" cols="30" placeholder="Enter your address"></textarea>
            <br><br>
            Skills Known: <input type="checkbox" name="g7">HTML
            <input type="checkbox" name="g7">CSS
            <input type="checkbox" name="g7">JAVA
            <input type="checkbox" name="g7">PHP<br><br>
            Inter Percentage : <input type="number" name="g8" min="0" max="100" required><br><br>
            upload Photo : <input type="file" name="g9" accept=".jpg,.jpeg,.png"><br><br>
            password : <input type="Password" name="g10" minlength="6" required><br><br>
            <input type="checkbox" name="g11" required>i agree to the terms & conditions.<br><br>

            <button type="submit" >REGISTER</button>
            <button type="reset">CLEAR ALL</button>
        </form>
    </body>
</html>
