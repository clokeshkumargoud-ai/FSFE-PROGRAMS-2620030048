<!DOCTYPE html>
<html>
    <head>
        <title>CLASSES</title>
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                line-height: 1.5;
            }
            .tight{
                line-height: 15;
            }
            .loose{
                line-height: 1.8;
            }
            .light{
                    font-weight: 100;
            }
            .bold{
                font-weight: 900;
            }

        </style>
    </head>
    <body>
        <p class="tight">tight line height make text harder to read when contend is long.</p><br>
        <p class="loose">Loose line height improves readability , espically for paragraph</p><br>
        <p class="light"> light font weight is subtle and mordern</p><br>
        <p class="bold">bold font is good for emphisis and headings</p><br>

    </body>
</html>
